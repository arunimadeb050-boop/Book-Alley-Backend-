<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buy a Book — LibShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/buy.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="logo">Book<span>Alley</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="login.html">Login</a>
        <button class="theme-btn" id="themeToggle">Dark mode</button>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <h1 class="page-title">Books for sale</h1>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search by title, author or category">
        <!-- CHANGED: the "condition" dropdown was removed (the backend has no condition field) -->
        <select id="sort">
          <option value="">Sort: Default</option>
          <option value="low">Price: Low to high</option>
          <option value="high">Price: High to low</option>
        </select>
      </div>
      <div class="book-grid" id="grid"></div>
      <p class="empty" id="empty" style="display:none">No books match your search.</p>
    </div>
  </section>

  <footer><div class="wrap">BookAlley, a student project</div></footer>

  <!-- CHANGED: shared helpers; theme code and sample data removed -->
  <script src="js/app.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');
    const sort = document.getElementById('sort');
    let books = [];

    // CHANGED: real backend call. type=sale (was "sell"), available=true (was status=available), no /api prefix
    async function loadBooks() {
      const r = await api('/books?type=sale&available=true');
      return r.ok ? r.data : [];
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      // CHANGED: b.category -> b.genre
      const list = books.filter(b => [b.title, b.author, b.genre].join(' ').toLowerCase().includes(q));
      if (sort.value === 'low') list.sort((a, b) => a.price - b.price);
      if (sort.value === 'high') list.sort((a, b) => b.price - a.price);

      grid.innerHTML = list.map(b => `
        <article class="book-card">
          <div class="cover"><span>${esc(b.title.charAt(0))}</span></div>
          <h3>${esc(b.title)}</h3>
          <p class="author">${esc(b.author)}</p>
          <div class="meta">
            <!-- CHANGED: badge shows genre (was condition) -->
            <span class="badge">${esc(b.genre || 'Book')}</span>
            <span class="price">৳ ${Number(b.price).toLocaleString('en-US')}</span>
          </div>
          <a class="btn" href="book.html?id=${b.id}">View book</a>
        </article>`).join('');
      empty.style.display = list.length ? 'none' : 'block';
    }

    search.addEventListener('input', render);
    sort.addEventListener('change', render);
    loadBooks().then(data => { books = data; render(); });
  </script>
</body>
</html>
