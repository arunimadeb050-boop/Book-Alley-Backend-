<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — LibShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header class="navbar">
    <div class="wrap header-inner">
      <div class="logo">Book<span>Alley</span></div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <button class="theme-btn" id="themeToggle">Light mode</button>
      </nav>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-grid">
      <div class="auth-card">
        <h2 class="card-title">Sign Up</h2>
        <form class="auth-form" id="signupForm">
          <label class="form-group">
            <span class="label-text">Full name</span>
            <!-- CHANGED: added id="signupName" so the script can read it -->
            <input type="text" id="signupName" class="form-input" required placeholder="John Doe">
          </label>
          <label class="form-group">
            <span class="label-text">Email</span>
            <!-- CHANGED: added id="signupEmail" -->
            <input type="email" id="signupEmail" class="form-input" required placeholder="you@example.com">
          </label>
          <label class="form-group">
            <span class="label-text">Password</span>
            <!-- CHANGED: minlength="6" because the backend needs 6+ characters -->
            <input type="password" id="signupPass" class="form-input" required minlength="6" placeholder="••••••••">
          </label>
          <label class="form-group">
            <span class="label-text">Confirm password</span>
            <input type="password" id="signupConfirm" class="form-input" required placeholder="••••••••">
          </label>

          <p class="auth-error" id="signupError">Passwords do not match.</p>

          <button type="submit" class="auth-btn">Create account</button>
          <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </form>
      </div>
    </div>
  </main>

  <!-- CHANGED: shared helpers; the theme code was removed from this page (it lives in app.js now) -->
  <script src="js/app.js"></script>
  <script>
    // CHANGED: handler is now async because it calls the backend
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('signupPass').value;
      const confirm = document.getElementById('signupConfirm').value;
      const error = document.getElementById('signupError');
      if (pass !== confirm) {
        error.textContent = 'Passwords do not match.';
        error.style.display = 'block';
        return;
      }
      error.style.display = 'none';

      // CHANGED: replaced console.log with a real request to POST /register
      const r = await api('/register', 'POST', {
        name: document.getElementById('signupName').value,
        email: document.getElementById('signupEmail').value,
        password: pass
      });
      if (!r.ok) {
        error.textContent = (r.data && r.data.error) || 'Could not sign up.'; // message comes from the backend
        error.style.display = 'block';
        return;
      }
      location.href = 'login.html'; // account created -> go log in
    });
  </script>
</body>
</html>
