<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Borrow requests — LibShare</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/borrow.css"><link rel="stylesheet" href="css/extra.css"></head>
<body>
  <header><div class="wrap header-inner"><div class="logo">Book<span>Alley</span></div><nav><a href="index.html">Home</a><a href="browse.html">Browse</a><a href="login.html">Login</a><button class="theme-btn" id="themeToggle">Dark mode</button></nav></div></header>
  <section class="section"><div class="wrap"><div class="page">
    <h1 class="page-title">Borrow requests</h1>
    <p class="note" id="note"></p>
    <h2>Requests for my books</h2>
    <div id="incoming"></div>
    <h2>Requests I sent</h2>
    <div id="outgoing"></div>
  </div></div></section>
  <footer><div class="wrap">BookAlley, a student project</div></footer>
  <script src="js/app.js"></script>
  <script>
    // NEW PAGE. Backend: GET /requests/incoming, GET /requests/outgoing,
    // POST /requests/{id}/approve (optional body {days}), /reject, /return
    if (requireLogin()) load();
    const note = document.getElementById('note');

    function buttons(q) {
      // The owner can approve/reject a pending request and confirm the return of an approved one
      if (q.status === 'pending') return `<select id="days${q.id}"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select>
        <button data-act="approve" data-id="${q.id}">Approve</button><button data-act="reject" data-id="${q.id}">Reject</button>`;
      if (q.status === 'approved') return `<button data-act="return" data-id="${q.id}">Mark as returned</button>`;
      return '';
    }
    function row(q, withButtons) {
      return `<div class="row">
        <div class="info"><strong><a href="book.html?id=${q.book_id}">${esc(q.book_title)}</a></strong>
          <p>Requested: ${esc(q.requested_at)}${q.due_date ? ' · Due: ' + esc(q.due_date) : ''}${q.overdue ? ' · OVERDUE' : ''}</p></div>
        <span class="pill">${esc(q.status)}</span>
        <div class="btns">${withButtons ? buttons(q) : ''}</div></div>`;
    }

    async function load() {
      const [inc, out] = await Promise.all([api('/requests/incoming'), api('/requests/outgoing')]);
      if (inc.status === 401) { location.href = 'login.html'; return; }
      const a = inc.ok ? inc.data : [], b = out.ok ? out.data : [];
      document.getElementById('incoming').innerHTML = a.length ? a.map(q => row(q, true)).join('') : '<p>No one has asked to borrow your books yet.</p>';
      document.getElementById('outgoing').innerHTML = b.length ? b.map(q => row(q, false)).join('') : '<p>You have not requested any books. <a href="borrow.html">Find one to borrow</a>.</p>';
    }

    document.getElementById('incoming').addEventListener('click', async (e) => {
      const act = e.target.dataset.act, id = e.target.dataset.id;
      if (!act) return;
      const body = act === 'approve' ? { days: Number(document.getElementById('days' + id).value) } : undefined;
      const r = await api('/requests/' + id + '/' + act, 'POST', body);
      note.textContent = r.ok ? '' : (r.data && r.data.error) || 'That did not work.';
      load();
    });
  </script>
</body>
</html>
