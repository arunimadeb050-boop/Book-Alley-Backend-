<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book — LibShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- NEW PAGE. borrow.css already has the .detail layout (cover on the left, details on the right) -->
  <link rel="stylesheet" href="css/borrow.css">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="logo">Book<span>Alley</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="login.html">Login</a>
        <button class="theme-btn" id="themeToggle">Dark mode</button>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="wrap" id="detail"><p class="empty">Loading…</p></div>
  </section>

  <footer><div class="wrap">BookAlley, a student project</div></footer>

  <script src="js/app.js"></script>
  <script>
    const detail = document.getElementById('detail');
    const id = new URLSearchParams(location.search).get('id'); // from book.html?id=5

    async function show() {
      const r = await api('/books/' + encodeURIComponent(id)); // GET /books/{id}
      if (!r.ok) { detail.innerHTML = '<p class="empty">' + esc((r.data && r.data.error) || 'Book not found.') + '</p>'; return; }
      const b = r.data;

      // Buttons depend on what the owner offered, and only show while the book is available
      let buttons = '';
      if (b.status === 'available' && b.for_lend) buttons += '<button class="btn" id="borrowBtn">Request to borrow</button> ';
      if (b.status === 'available' && b.for_sale) buttons += '<button class="btn ghost" id="cartBtn">Add to cart</button>';
      if (b.status !== 'available') buttons = '<span class="status">' + esc(b.status) + '</span>';

      detail.innerHTML = `
        <article class="detail">
          <div class="cover"><span>${esc(b.title.charAt(0))}</span></div>
          <div>
            <h1>${esc(b.title)}</h1>
            <p class="author">${esc(b.author)}</p>
            <dl>
              <dt>Genre</dt><dd>${esc(b.genre || '—')}</dd>
              <dt>Offered for</dt><dd>${[b.for_lend ? 'Lending' : '', b.for_sale ? 'Sale' : ''].filter(Boolean).join(' and ')}</dd>
              ${b.for_sale ? '<dt>Price</dt><dd class="price">৳ ' + Number(b.price).toLocaleString('en-US') + '</dd>' : ''}
              <dt>Owner</dt><dd><a href="profile.html?id=${b.owner_id}">View profile</a></dd>
            </dl>
            <p class="desc" style="white-space:pre-line">${esc(b.description)}</p>
            ${buttons}
            <p class="notice" id="msg"></p>
          </div>
        </article>`;

      const msg = document.getElementById('msg');

      // Borrow -> POST /books/{id}/request
      const borrowBtn = document.getElementById('borrowBtn');
      if (borrowBtn) borrowBtn.addEventListener('click', async () => {
        if (!requireLogin()) return;
        const res = await api('/books/' + b.id + '/request', 'POST');
        if (res.status === 401) { location.href = 'login.html'; return; }
        msg.textContent = res.ok ? 'Request sent. The owner will approve or reject it.' : (res.data && res.data.error) || 'Could not send request.';
      });

      // Buy -> POST /cart/{bookId}
      const cartBtn = document.getElementById('cartBtn');
      if (cartBtn) cartBtn.addEventListener('click', async () => {
        if (!requireLogin()) return;
        const res = await api('/cart/' + b.id, 'POST');
        if (res.status === 401) { location.href = 'login.html'; return; }
        msg.textContent = res.ok ? 'Added to your cart.' : (res.data && res.data.error) || 'Could not add to cart.';
      });
    }
    show();
  </script>
</body>
</html>
