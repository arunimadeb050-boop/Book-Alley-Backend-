<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell a Book — LibShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sell.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <div class="logo">Book<span>Alley</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="login.html">Login</a>
        <button class="theme-btn" id="themeToggle">Dark mode</button>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <div class="sell-card">
        <h1>Sell a Book</h1>
        <form id="sellForm" autocomplete="off">
          <label>Book title <input type="text" id="bookTitle" required></label>
          <label>Author <input type="text" id="bookAuthor" required></label>
          <label>Category
            <input type="text" id="bookCategory" placeholder="e.g. Fiction, Academic, Poetry" required>
          </label>
          <label>Condition
            <select id="bookCondition">
              <option>New</option><option selected>Good</option><option>Fair</option><option>Worn</option>
            </select>
          </label>
          <label>Description
            <textarea id="bookDescription" rows="4" placeholder="A short note about the book, edition, or its condition"></textarea>
          </label>
          <!-- NOTE: the backend does not store cover images yet, so this file is not sent -->
          <label>Book cover <input type="file" id="bookCover" accept="image/*"></label>
          <label>Price
            <div class="price-field">
              <span class="price-symbol">৳</span>
              <!-- CHANGED: min="1" (was 0) because the backend rejects a book for sale with price 0 -->
              <input type="number" id="bookPrice" min="1" step="1" inputmode="numeric" placeholder="0" required>
            </div>
          </label>

          <p class="form-error" id="sellError">Please fill in the required fields.</p>
          <div class="sell-actions"><button type="submit">List for Sale</button></div>
        </form>
      </div>
    </div>
  </section>

  <footer><div class="wrap">BookAlley, a student project</div></footer>

  <!-- CHANGED: shared helpers; theme code removed from this page -->
  <script src="js/app.js"></script>
  <script>
    requireLogin(); // CHANGED: selling needs a login

    // CHANGED: async
    document.getElementById('sellForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('sellError');
      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      const category = document.getElementById('bookCategory').value.trim();
      const price = Number(document.getElementById('bookPrice').value);
      if (!title || !author || !category || !(price > 0)) { error.textContent = 'Please fill in the required fields (price must be above 0).'; error.style.display = 'block'; return; }
      error.style.display = 'none';

      // CHANGED: condition is added to the description (backend has no condition column)
      const note = document.getElementById('bookDescription').value.trim();
      const description = note + (note ? '\n' : '') + 'Condition: ' + document.getElementById('bookCondition').value + '.';

      // CHANGED: replaced console.log with POST /books.
      // category -> genre, type:'sell' -> for_sale:true / for_lend:false
      const r = await api('/books', 'POST', {
        title, author, genre: category, description,
        for_lend: false, for_sale: true, price
      });
      if (r.status === 401) { location.href = 'login.html'; return; }
      if (!r.ok) { error.textContent = (r.data && r.data.error) || 'Could not list the book.'; error.style.display = 'block'; return; }
      location.href = 'book.html?id=' + r.data.id;
    });
  </script>
</body>
</html>
