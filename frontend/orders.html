<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your orders — LibShare</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/borrow.css"><link rel="stylesheet" href="css/extra.css"></head>
<body>
  <header><div class="wrap header-inner"><div class="logo">Book<span>Alley</span></div><nav><a href="index.html">Home</a><a href="browse.html">Browse</a><a href="login.html">Login</a><button class="theme-btn" id="themeToggle">Dark mode</button></nav></div></header>
  <section class="section"><div class="wrap"><div class="page">
    <h1 class="page-title">Your orders</h1>
    <div id="orders"></div>
  </div></div></section>
  <footer><div class="wrap">BookAlley, a student project</div></footer>
  <script src="js/app.js"></script>
  <script>
    // NEW PAGE. Backend: GET /orders
    if (requireLogin()) (async () => {
      const r = await api('/orders');
      if (r.status === 401) { location.href = 'login.html'; return; }
      const orders = r.ok ? r.data : [];
      document.getElementById('orders').innerHTML = orders.length ? orders.map(o => `
        <div class="row" style="display:block;border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0">
          <strong>Order #${o.id}</strong> <span class="pill">${esc(o.created_at)}</span>
          <span style="float:right">৳ ${Number(o.total).toLocaleString('en-US')}</span>
          ${(o.items || []).map(i => `
            <p style="margin:.4rem 0">${esc(i.title)} — ৳ ${Number(i.price).toLocaleString('en-US')}
              · <a href="profile.html?id=${i.seller_id}">Seller &amp; review</a></p>`).join('')}
        </div>`).join('') : '<p>No orders yet. <a href="buy.html">Browse books for sale</a>.</p>';
    })();
  </script>
</body>
</html>
